openapi: 3.1.0
x-release-validation-profile: ./release_profile_1_0.json
x-implementation-status: DESIGN_NOT_EXECUTED
info:
  title: LibertyWiki Native REST API (Draft)
  version: 1.1.0-draft
  description: Native RESTful 공개 API 대표 계약 설계 초안. /w/api.php 및 /w/rest.php/* 는 별도 MediaWiki Compatible API 계열이며 이 문서는 그 전체 계약이
    아님. 신규 MediaWiki API에는 반드시 Native 동등 operation을 추가해야 함. 전체 API 목록 미완료.
servers:
- url: https://wiki.example.invalid/api/v1
  description: Native RESTful API only
security:
- bearerAuth: []
tags:
- name: Pages
- name: Revisions
- name: Search
- name: Uploads
- name: Admin
- name: Extensions
- name: Users
- name: Watchlist
- name: Media
- name: Site
- name: Parser
paths:
  /pages:
    post:
      tags:
      - Pages
      summary: 문서 생성
      operationId: createPage
      description: 내부 시험용 일반 이름공간 Wikitext 생성. 같은 정규화 제목으로 다시 요청하면 409가 반환된다.
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSourcePage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Invalid'
  /pages/{pageId}/revisions:
    get:
      tags:
      - Revisions
      summary: 문서 리비전 이력 조회
      operationId: getRevisions
      description: >-
        내부 시험용 일반 이름공간 문서의 이력을 시각 역순으로 반환한다. 동일 시각은 숫자 리비전 ID의 역순으로 정렬한다.
        응답에는 Cache-Control no-store를 적용한다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/PageId'
      - name: cursor
        in: query
        required: false
        description: 직전 응답의 nextCursor. 해당 리비전을 제외하고 더 오래된 항목을 반환한다.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Revision history
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionHistory'
        '400':
          description: INVALID_CURSOR or INVALID_LIMIT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: PAGE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: INVALID_PAGE_ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Revisions
      operationId: commitRevision
      summary: 새 불변 리비전 생성
      description: >-
        내부 시험용 일반 이름공간 Wikitext 원문 편집. 현재 리비전 ID를
        baseRevisionId로 제출한다. 저장에 성공하면 새 현재 리비전과 원문을
        반환한다. 같은 기준 리비전으로 다시 요청하면 409가 반환된다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '201':
          description: Revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSourcePage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: PAGE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: EDIT_CONFLICT
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Invalid'
  /parse:
    post:
      tags:
      - Pages
      operationId: parseWikitext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                source:
                  type: string
                  maxLength: 3000000
                title:
                  type: string
                namespaceId:
                  type: integer
      responses:
        '200':
          description: Sanitized HTML and parser diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                  diagnostics:
                    type: array
                    items:
                      type: object
  /search:
    get:
      tags:
      - Search
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: namespaceId
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        '503':
          $ref: '#/components/responses/Unavailable'
  /files/uploads:
    post:
      tags:
      - Uploads
      operationId: beginUpload
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - byteSize
              - sha256
              - mimeType
              properties:
                name:
                  type: string
                byteSize:
                  type: integer
                  minimum: 1
                sha256:
                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                mimeType:
                  type: string
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadId
                - state
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                    - PENDING
                  uploadUrl:
                    type: string
                    format: uri
                    description: Allowed only for authorized temporary storage targets
        '403':
          $ref: '#/components/responses/Forbidden'
  /pages/by-title/{title}:
    get:
      tags:
      - Pages
      summary: CAP-PAGE-READ-TITLE
      operationId: getPageByTitle
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: title
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current Wikitext source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSourcePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /revisions/{revisionId}:
    get:
      tags:
      - Revisions
      summary: 리비전 원문 조회
      operationId: getRevision
      description: >-
        내부 시험용 일반 이름공간 문서의 특정 리비전에 저장된 Wikitext를 반환한다.
        응답에는 Cache-Control no-store를 적용한다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: revisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Stored revision source
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: REVISION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: INVALID_REVISION_ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /revisions/{fromId}/compare/{toId}:
    get:
      tags:
      - Revisions
      summary: 저장된 Wikitext 리비전 비교
      operationId: compareRevisions
      description: >-
        같은 문서의 저장된 두 리비전을 from에서 to 순서로 비교한다. 양쪽에 읽기 권한이 필요하다.
        원문이 동일하면 lines가 빈 배열이다. 응답에는 Cache-Control no-store를 적용한다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: fromId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: toId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ordered Wikitext line and inline changes
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionComparison'
        '400':
          description: REVISION_PAGE_MISMATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: REVISION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: INVALID_REVISION_ID or COMPARISON_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pages/{pageId}/moves:
    post:
      tags:
      - Pages
      summary: CAP-PAGE-MOVE
      operationId: movePage
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': &id001
          description: Unauthorized
        '403': &id002
          description: Forbidden
        '404': &id003
          description: Not Found
        '409': &id004
          description: Conflict
        '422': &id005
          description: Unprocessable Entity
  /pages/{pageId}:
    get:
      tags:
      - Pages
      summary: 문서 조회
      operationId: getPage
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSourcePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Pages
      summary: CAP-PAGE-DELETE
      operationId: deletePage
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /pages/{pageId}/restorations:
    post:
      tags:
      - Pages
      summary: CAP-PAGE-UNDELETE
      operationId: restorePage
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /pages/{pageId}/protection:
    put:
      tags:
      - Search
      summary: CAP-PAGE-PROTECT
      operationId: setPageProtection
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /pages/{pageId}/rollbacks:
    post:
      tags:
      - Revisions
      summary: CAP-REVISION-ROLLBACK
      operationId: rollbackRevision
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /pages/{pageId}/undos:
    post:
      tags:
      - Revisions
      summary: 후속 편집을 보존하며 리비전 한 건 취소
      operationId: undoRevision
      description: >-
        내부 시험용 일반 이름공간 Wikitext의 단일 편집 취소. read와 edit 권한이
        필요하다. 부모와 대상의 차이를 최신 원문에 역적용하며 겹치지 않는 후속
        변경을 보존한다. 적용 위치가 모호하거나 변경이 겹치면 저장하지 않는다.
        baseRevisionId를 제공하면 현재 판과 일치해야 한다. 생략하면 요청 처리 중
        읽은 현재 판을 저장 기준으로 사용한다. 응답을 받지 못하면 현재 문서와
        이력을 조회하여 결과를 확인한다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoRevisionRequest'
      responses:
        '201':
          description: 선택한 변경을 취소하고 후속 변경을 보존한 새 리비전과 현재 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSourcePage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN 또는 REVISION_SOURCE_HIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PAGE_NOT_FOUND 또는 REVISION_NOT_FOUND. 다른 문서의 리비전 ID도 REVISION_NOT_FOUND를 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 기준판 변경이나 겹침·모호한 적용 위치는 EDIT_CONFLICT. 첫 리비전에는 UNDO_NO_PARENT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 잘못된 요청 또는 병합 처리 한도 초과(UNDO_TOO_LARGE). 새로 조회해도 한도 초과가 해소되지는 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /watchlist/pages/{pageId}:
    put:
      tags:
      - Watchlist
      summary: CAP-WATCH
      operationId: watchPage
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
    delete:
      tags:
      - Watchlist
      summary: CAP-WATCH-REMOVE
      operationId: unwatchPage
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /recent-changes:
    get:
      tags:
      - Search
      summary: CAP-RECENTCHANGES
      operationId: getRecentChanges
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /users/me:
    get:
      tags:
      - Users
      summary: CAP-USER-INFO
      operationId: getCurrentUser
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /users/{userId}/contributions:
    get:
      tags:
      - Users
      summary: CAP-USER-CONTRIB
      operationId: getUserContributions
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /files/{fileId}/content:
    get:
      tags:
      - Media
      summary: CAP-FILE-CONTENT
      operationId: getFileContent
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /files/{fileId}:
    get:
      tags:
      - Media
      summary: CAP-FILE-INFO
      operationId: getFileInfo
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /pages/{pageId}/templates:
    get:
      tags:
      - Parser
      summary: CAP-TEMPLATE-QUERY
      operationId: getUsedTemplates
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id005
  /pages/{pageId}/backlinks:
    get:
      tags:
      - Pages
      summary: CAP-BACKLINKS
      operationId: getBacklinks
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '계약 설계 초안: 정상 결과 스키마 상세화 필요'
        '401': *id001
        '403': *id002
