components:
  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
  parameters:
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Page:
      type: object
      required:
      - id
      - namespaceId
      - normalizedTitle
      - currentRevisionId
      - status
      properties:
        id:
          type: string
          format: uuid
        namespaceId:
          type: integer
        normalizedTitle:
          type: string
        currentRevisionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - SUPPRESSED
        redirectTarget:
          type:
          - string
          - 'null'
    CurrentSourcePage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        required: [source, contentModel, createdAt]
        properties:
          source:
            type: string
          contentModel:
            const: wikitext
          createdAt:
            type: string
            format: date-time
    RevisionHistoryEntry:
      type: object
      required: [id, parentRevisionId, createdAt, summary]
      properties:
        id:
          type: string
          format: uuid
        parentRevisionId:
          type:
          - string
          - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        summary:
          type: string
    RevisionHistory:
      type: object
      required: [revisions, nextCursor]
      properties:
        revisions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RevisionHistoryEntry'
        nextCursor:
          type: [string, 'null']
          format: uuid
          description: 다음 페이지가 있으면 이 응답의 마지막 리비전 UUID. 마지막 페이지이면 null.
    RevisionComparison:
      type: object
      additionalProperties: false
      required: [from, to, lines]
      properties:
        from:
          $ref: '#/components/schemas/ComparisonRevision'
        to:
          $ref: '#/components/schemas/ComparisonRevision'
        lines:
          type: array
          maxItems: 4000
          items:
            $ref: '#/components/schemas/DiffLine'
    ComparisonRevision:
      type: object
      additionalProperties: false
      required: [id, pageId, title, timestamp]
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        title:
          type: string
        timestamp:
          type: string
          format: date-time
    DiffLine:
      type: object
      additionalProperties: false
      required: [type, fromLine, toLine, from, to]
      properties:
        type:
          type: string
          enum: [context, added, deleted, changed]
        fromLine:
          description: 1부터 시작하는 원본 줄 번호. 추가 줄은 null이다.
          type: [integer, 'null']
          minimum: 1
        toLine:
          description: 1부터 시작하는 대상 줄 번호. 삭제 줄은 null이다.
          type: [integer, 'null']
          minimum: 1
        from:
          type: array
          items:
            $ref: '#/components/schemas/DiffFragment'
        to:
          type: array
          items:
            $ref: '#/components/schemas/DiffFragment'
    DiffFragment:
      type: object
      additionalProperties: false
      required: [text, changed]
      properties:
        text:
          type: string
          description: HTML이 아닌 리비전 원문 조각.
        changed:
          type: boolean
    RevisionSource:
      allOf:
      - $ref: '#/components/schemas/RevisionHistoryEntry'
      - type: object
        required: [pageId, normalizedTitle, source, contentModel]
        properties:
          pageId:
            type: string
            format: uuid
          normalizedTitle:
            type: string
          source:
            type: string
          contentModel:
            const: wikitext
    CreatePageRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - namespaceId
      - source
      properties:
        title:
          type: string
          minLength: 1
        namespaceId:
          type: integer
          const: 0
        source:
          type: string
          description: UTF-8 기준 최대 1048576바이트의 Wikitext
        summary:
          type: string
          maxLength: 500
    RevisionRequest:
      type: object
      additionalProperties: false
      required:
      - baseRevisionId
      - source
      properties:
        source:
          type: string
          description: UTF-8 기준 최대 1048576바이트의 Wikitext
        baseRevisionId:
          type: string
          format: uuid
        summary:
          type: string
          maxLength: 500
    UndoRevisionRequest:
      type: object
      additionalProperties: false
      required: [revisionId]
      properties:
        revisionId:
          type: string
          format: uuid
          description: 취소할 리비전 ID. 부모가 있는 과거 판도 허용한다.
        baseRevisionId:
          type: string
          format: uuid
          description: 사용자가 확인한 현재 리비전 ID. 생략할 수 있지만 명시적 null은 허용하지 않는다. 저장 시 현재 판과 다르면 거부한다.
        summary:
          type: string
          maxLength: 500
          default: ''
    EditConflict:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      dependentRequired:
        comparison: [currentRevisionId]
      properties:
        code:
          const: EDIT_CONFLICT
        message:
          type: string
        requestId:
          type: string
          format: uuid
        currentRevisionId:
          type: string
          format: uuid
          description: 충돌 판정 시점의 공개 현재 리비전 UUID. 이후 저장에서는 이 UUID를 새 baseRevisionId로 명시적으로 제출할 수 있다.
        comparison:
          $ref: '#/components/schemas/RevisionComparison'
          description: 요청 기준판에서 충돌 시점 공개판까지의 원문 차이. 판이 없거나 제한되었거나 비교 한도를 초과하면 생략한다. to.id는 currentRevisionId와 같다.
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
  responses:
    Unauthorized:
      description: Invalid Bearer credential
      headers:
        WWW-Authenticate:
          schema:
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Expected application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Dependent service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
x-api-families:
  mediaWikiCompatible:
    actionApi: /w/api.php
    mediaWikiRestApi: /w/rest.php/*
  nativeRestful: /api/v1/*
x-release-policy: 모든 신규 MediaWiki 버전의 API/기능 업데이트 시 MediaWiki Compatible과 Native RESTful을 동시 구현·테스트.
